<text x="80" y="400.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >• dunkel, riecht nach Waldboden</text>
<text x="80" y="416.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >• runde Krümel, zerfällt leicht</text>
