<text x="502" y="150.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >einjährige Triebe – stehen lassen</text>
<text x="502" y="166.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >(bei Schwarzer Johannisbeere Fruchtholz)</text>
