<text x="502" y="324" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold" >Schnittstelle</text>
<text x="450" y="364.0" font-size="13" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Ziel: 8–12 Bodentriebe unterschiedlichen</text>
<text x="450" y="380.9" font-size="13" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Alters. Schnitt nach der Ernte oder im</text>
<text x="450" y="397.8" font-size="13" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Spätwinter.</text>
