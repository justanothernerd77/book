<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Hochbeet im Querschnitt">
<title>Hochbeet im Querschnitt</title>
<rect width="820" height="560" fill="#fbfaf5"/>
<text x="24" y="38" font-size="22" fill="#2b2b26" text-anchor="start" font-weight="bold" >Hochbeet im Querschnitt</text>
<text x="24" y="62" font-size="14" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Befüllung in vier Schichten, von unten nach oben</text>
<rect x="60" y="130" width="320" height="70" rx="0" fill="#4a3a2c" stroke="#2b2b26" stroke-width="0.8" />
<rect x="60" y="200" width="320" height="55" rx="0" fill="#6e4f35" stroke="#2b2b26" stroke-width="0.8" />
<rect x="60" y="255" width="320" height="42" rx="0" fill="#8aa35a" stroke="#2b2b26" stroke-width="0.8" />
<rect x="60" y="297" width="320" height="80" rx="0" fill="#9b7650" stroke="#2b2b26" stroke-width="0.8" />
<rect x="46" y="110" width="14" height="267" rx="0" fill="#c89f6a" stroke="#2b2b26" stroke-width="1" />
<rect x="380" y="110" width="14" height="267" rx="0" fill="#c89f6a" stroke="#2b2b26" stroke-width="1" />
<line x1="62" y1="120" x2="62" y2="377" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="378" y1="120" x2="378" y2="377" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="46" y1="381" x2="394" y2="381" stroke="#555" stroke-width="3" stroke-dasharray="2 3"/>
<rect x="20" y="385" width="400" height="40" rx="0" fill="#bda77f" stroke="none" stroke-width="1" />
<text x="220.0" y="411" font-size="13" fill="#2b2b26" text-anchor="middle" font-weight="normal" >gewachsener Boden</text>
<path d="M100,130 q-10,-28 -18,-34 M100,130 q10,-30 16,-36 M100,130 v-40" stroke="#6a8f3d" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M170,130 q-10,-28 -18,-34 M170,130 q10,-30 16,-36 M170,130 v-40" stroke="#6a8f3d" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M240,130 q-10,-28 -18,-34 M240,130 q10,-30 16,-36 M240,130 v-40" stroke="#6a8f3d" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M310,130 q-10,-28 -18,-34 M310,130 q10,-30 16,-36 M310,130 v-40" stroke="#6a8f3d" stroke-width="4" fill="none" stroke-linecap="round"/>
<rect x="470" y="137" width="18" height="18" rx="0" fill="#4a3a2c" stroke="#2b2b26" stroke-width="0.8" />
<text x="498" y="150.0" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >Pflanzschicht: reifer Kompost</text>
<text x="498" y="168.2" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >und Gartenerde (20–25 cm)</text>
<rect x="470" y="195" width="18" height="18" rx="0" fill="#6e4f35" stroke="#2b2b26" stroke-width="0.8" />
<text x="498" y="208.0" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >halbreifer Kompost oder</text>
<text x="498" y="226.2" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >angerotteter Mist (15–20 cm)</text>
<rect x="470" y="253" width="18" height="18" rx="0" fill="#8aa35a" stroke="#2b2b26" stroke-width="0.8" />
<text x="498" y="266.0" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >Grassoden umgedreht, Laub,</text>
<text x="498" y="284.2" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >Grünschnitt (10–15 cm)</text>
<rect x="470" y="311" width="18" height="18" rx="0" fill="#9b7650" stroke="#2b2b26" stroke-width="0.8" />
<text x="498" y="324.0" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >grober Gehölzschnitt,</text>
<text x="498" y="342.2" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >Äste (20–30 cm)</text>
<line x1="24" y1="450" x2="60" y2="450" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="6 4"/>
<text x="70" y="455" font-size="13" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Noppenfolie an den Innenwänden (nicht auf den Boden)</text>
<line x1="24" y1="474" x2="60" y2="474" stroke="#555" stroke-width="3" stroke-dasharray="2 3"/>
<text x="70" y="479" font-size="13" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Wühlmausdraht, Maschenweite höchstens 13 mm</text>
<text x="24" y="505" font-size="13" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Breite 120 cm, Höhe 70–90 cm · die Füllung sackt im ersten Jahr um 10–20 cm – jährlich Kompost nachfüllen</text>
