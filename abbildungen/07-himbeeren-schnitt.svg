<text x="40" y="432.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Nach der Ernte: abgetragene (braune) Ruten bodennah</text>
<text x="40" y="448.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >raus, 8–10 kräftige junge Ruten je Meter anbinden.</text>
