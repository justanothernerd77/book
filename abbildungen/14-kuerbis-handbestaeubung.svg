<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Kürbis von Hand bestäuben">
<title>Kürbis von Hand bestäuben</title>
<rect width="820" height="420" fill="#fbfaf5"/>
<defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b26"/></marker></defs>
<text x="24" y="38" font-size="22" fill="#2b2b26" text-anchor="start" font-weight="bold" >Kürbis von Hand bestäuben</text>
<text x="24" y="62" font-size="14" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Für sortenreines Saatgut – alle Zucchini und Gartenkürbisse kreuzen sich</text>
<line x1="130" y1="230" x2="130" y2="330" stroke="#6a8f3d" stroke-width="5" />
<ellipse cx="130" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(-40 130 220)"/>
<ellipse cx="130" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(-15 130 220)"/>
<ellipse cx="130" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(15 130 220)"/>
<ellipse cx="130" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(40 130 220)"/>
<text x="130" y="360" font-size="14" fill="#2b2b26" text-anchor="middle" font-weight="bold" >männliche Blüte</text>
<text x="130" y="380" font-size="12" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >langer Stiel, kein Fruchtknoten</text>
<line x1="330" y1="230" x2="330" y2="330" stroke="#6a8f3d" stroke-width="5" />
<ellipse cx="330" cy="248" rx="14" ry="20" fill="#8fbf4a" stroke="#2b2b26" stroke-width="1"/>
<ellipse cx="330" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(-40 330 220)"/>
<ellipse cx="330" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(-15 330 220)"/>
<ellipse cx="330" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(15 330 220)"/>
<ellipse cx="330" cy="190" rx="14" ry="36" fill="#f2b705" stroke="#c98f00" stroke-width="1" transform="rotate(40 330 220)"/>
<text x="330" y="360" font-size="14" fill="#2b2b26" text-anchor="middle" font-weight="bold" >weibliche Blüte</text>
<text x="330" y="380" font-size="12" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >mit kleinem Fruchtknoten</text>
<path d="M150,160 C200,110 270,110 310,150" stroke="#2b2b26" stroke-width="2" fill="none" marker-end="url(#pfeil)"/>
<text x="230" y="112" font-size="12" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >Pollen übertragen</text>
<circle cx="461" cy="115" r="11" fill="#2b2b26"/>
<text x="461" y="120" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >1</text>
<text x="480" y="120.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Am Vorabend eine männliche und eine</text>
<text x="480" y="136.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >weibliche Blüte derselben Sorte suchen,</text>
<text x="480" y="153.8" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >die am nächsten Morgen aufgehen.</text>
<circle cx="461" cy="179.7" r="11" fill="#2b2b26"/>
<text x="461" y="184.7" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >2</text>
<text x="480" y="184.7" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Beide mit Klebeband oder Gummiring</text>
<text x="480" y="201.6" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >verschließen.</text>
<circle cx="461" cy="227.5" r="11" fill="#2b2b26"/>
<text x="461" y="232.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >3</text>
<text x="480" y="232.5" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Morgens die männliche Blüte pflücken,</text>
<text x="480" y="249.4" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Blütenblätter abzupfen, Pollen auf die</text>
<text x="480" y="266.3" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Narbe der weiblichen Blüte tupfen.</text>
<circle cx="461" cy="292.2" r="11" fill="#2b2b26"/>
<text x="461" y="297.2" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >4</text>
<text x="480" y="297.2" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Weibliche Blüte wieder verschließen,</text>
<text x="480" y="314.09999999999997" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Stiel mit einem Band markieren.</text>
</svg>
