<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Pflanzschnitt beim Apfel">
<title>Pflanzschnitt beim Apfel</title>
<rect width="820" height="480" fill="#fbfaf5"/>
<text x="24" y="38" font-size="22" fill="#2b2b26" text-anchor="start" font-weight="bold" >Pflanzschnitt beim Apfel</text>
<text x="24" y="62" font-size="14" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Ein Mitteltrieb, drei bis vier flache Leitäste, alles Konkurrierende raus</text>
<rect x="60" y="420" width="300" height="20" rx="0" fill="#bda77f" stroke="none" stroke-width="1" />
<line x1="210" y1="420" x2="210" y2="150" stroke="#7a5a3a" stroke-width="9" />
<line x1="210" y1="300" x2="100" y2="245" stroke="#7a5a3a" stroke-width="5" />
<line x1="210" y1="280" x2="325" y2="230" stroke="#7a5a3a" stroke-width="5" />
<line x1="210" y1="240" x2="115" y2="195" stroke="#7a5a3a" stroke-width="5" />
<line x1="210" y1="215" x2="300" y2="175" stroke="#7a5a3a" stroke-width="5" />
<line x1="214" y1="200" x2="240" y2="120" stroke="#7a5a3a" stroke-width="5" />
<text x="210" y="465" font-size="15" fill="#2b2b26" text-anchor="middle" font-weight="bold" >vorher</text>
<rect x="410" y="420" width="300" height="20" rx="0" fill="#bda77f" stroke="none" stroke-width="1" />
<line x1="560" y1="420" x2="560" y2="150" stroke="#7a5a3a" stroke-width="9" />
<line x1="560" y1="300" x2="486.3" y2="263.15" stroke="#7a5a3a" stroke-width="5" />
<line x1="486.3" y1="263.15" x2="450" y2="245" stroke="#b9b6a5" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="477.3" y1="263.15" x2="495.3" y2="263.15" stroke="#c0392b" stroke-width="4" stroke-linecap="round" transform="rotate(125 486.3 263.15)"/>
<line x1="560" y1="280" x2="637.05" y2="246.5" stroke="#7a5a3a" stroke-width="5" />
<line x1="637.05" y1="246.5" x2="675" y2="230" stroke="#b9b6a5" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="628.05" y1="246.5" x2="646.05" y2="246.5" stroke="#c0392b" stroke-width="4" stroke-linecap="round" transform="rotate(55 637.05 246.5)"/>
<line x1="560" y1="240" x2="496.35" y2="209.85" stroke="#7a5a3a" stroke-width="5" />
<line x1="496.35" y1="209.85" x2="465" y2="195" stroke="#b9b6a5" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="487.35" y1="209.85" x2="505.35" y2="209.85" stroke="#c0392b" stroke-width="4" stroke-linecap="round" transform="rotate(125 496.35 209.85)"/>
<line x1="560" y1="215" x2="620.3" y2="188.2" stroke="#7a5a3a" stroke-width="5" />
<line x1="620.3" y1="188.2" x2="650" y2="175" stroke="#b9b6a5" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="611.3" y1="188.2" x2="629.3" y2="188.2" stroke="#c0392b" stroke-width="4" stroke-linecap="round" transform="rotate(55 620.3 188.2)"/>
<line x1="564" y1="200" x2="590" y2="120" stroke="#b9b6a5" stroke-width="4" stroke-dasharray="4 4"/>
<line x1="559.0" y1="190" x2="577.0" y2="190" stroke="#c0392b" stroke-width="4" stroke-linecap="round" transform="rotate(20 568 190)"/>
<text x="560" y="465" font-size="15" fill="#2b2b26" text-anchor="middle" font-weight="bold" >nachher</text>
<text x="410" y="280" font-size="36" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >→</text>
<text x="705" y="150.0" font-size="12" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Leitäste um</text>
<text x="705" y="166.2" font-size="12" fill="#6b6b5e" text-anchor="start" font-weight="normal" >ein Drittel</text>
<text x="705" y="182.4" font-size="12" fill="#6b6b5e" text-anchor="start" font-weight="normal" >einkürzen,</text>
<text x="705" y="198.6" font-size="12" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Schnitt über</text>
<text x="705" y="214.8" font-size="12" fill="#6b6b5e" text-anchor="start" font-weight="normal" >einem nach</text>
<text x="705" y="231.0" font-size="12" fill="#6b6b5e" text-anchor="start" font-weight="normal" >außen zeigenden</text>
<text x="705" y="247.2" font-size="12" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Auge</text>
<text x="345" y="120.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" >steiler Konkurrenz-</text>
<text x="345" y="135.6" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal" >trieb: ganz entfernen</text>
</svg>
