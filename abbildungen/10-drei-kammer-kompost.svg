<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Drei-Kammer-Kompost">
<title>Drei-Kammer-Kompost</title>
<rect width="820" height="390" fill="#fbfaf5"/>
<text x="24" y="38" font-size="22" fill="#2b2b26" text-anchor="start" font-weight="bold" >Drei-Kammer-Kompost</text>
<text x="24" y="62" font-size="14" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Eine Kammer wird befüllt, eine reift, eine wird geleert</text>
<rect x="60" y="110" width="220" height="190" rx="0" fill="#8aa35a" stroke="#2b2b26" stroke-width="1.2" fill-opacity="0.85"/>
<line x1="60" y1="141.66666666666666" x2="280" y2="141.66666666666666" stroke="#00000022" stroke-width="1" />
<line x1="60" y1="173.33333333333334" x2="280" y2="173.33333333333334" stroke="#00000022" stroke-width="1" />
<line x1="60" y1="205.0" x2="280" y2="205.0" stroke="#00000022" stroke-width="1" />
<line x1="60" y1="236.66666666666669" x2="280" y2="236.66666666666669" stroke="#00000022" stroke-width="1" />
<line x1="60" y1="268.33333333333337" x2="280" y2="268.33333333333337" stroke="#00000022" stroke-width="1" />
<text x="170.0" y="98" font-size="16" fill="#2b2b26" text-anchor="middle" font-weight="bold" >1  Befüllen</text>
<text x="170.0" y="322" font-size="13" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >laufend Grün + Braun</text>
<text x="170.0" y="180.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >Küchenabfälle</text>
<text x="170.0" y="198.2" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >Rasenschnitt</text>
<text x="170.0" y="216.4" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >Laub, Häcksel</text>
<rect x="300" y="110" width="220" height="190" rx="0" fill="#8a6a48" stroke="#2b2b26" stroke-width="1.2" fill-opacity="0.85"/>
<line x1="300" y1="141.66666666666666" x2="520" y2="141.66666666666666" stroke="#00000022" stroke-width="1" />
<line x1="300" y1="173.33333333333334" x2="520" y2="173.33333333333334" stroke="#00000022" stroke-width="1" />
<line x1="300" y1="205.0" x2="520" y2="205.0" stroke="#00000022" stroke-width="1" />
<line x1="300" y1="236.66666666666669" x2="520" y2="236.66666666666669" stroke="#00000022" stroke-width="1" />
<line x1="300" y1="268.33333333333337" x2="520" y2="268.33333333333337" stroke="#00000022" stroke-width="1" />
<text x="410.0" y="98" font-size="16" fill="#2b2b26" text-anchor="middle" font-weight="bold" >2  Reifen</text>
<text x="410.0" y="322" font-size="13" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >nach 9–12 Monaten umsetzen</text>
<text x="410.0" y="180.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >Rotte läuft,</text>
<text x="410.0" y="198.2" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >Würmer ziehen ein</text>
<rect x="540" y="110" width="220" height="190" rx="0" fill="#4a3a2c" stroke="#2b2b26" stroke-width="1.2" fill-opacity="0.85"/>
<line x1="540" y1="141.66666666666666" x2="760" y2="141.66666666666666" stroke="#00000022" stroke-width="1" />
<line x1="540" y1="173.33333333333334" x2="760" y2="173.33333333333334" stroke="#00000022" stroke-width="1" />
<line x1="540" y1="205.0" x2="760" y2="205.0" stroke="#00000022" stroke-width="1" />
<line x1="540" y1="236.66666666666669" x2="760" y2="236.66666666666669" stroke="#00000022" stroke-width="1" />
<line x1="540" y1="268.33333333333337" x2="760" y2="268.33333333333337" stroke="#00000022" stroke-width="1" />
<text x="650.0" y="98" font-size="16" fill="#2b2b26" text-anchor="middle" font-weight="bold" >3  Entnehmen</text>
<text x="650.0" y="322" font-size="13" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >nach 1–2 Jahren reif</text>
<text x="650.0" y="180.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >dunkel, krümelig,</text>
<text x="650.0" y="198.2" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" >riecht nach Waldboden</text>
<text x="410" y="370" font-size="13" fill="#6b6b5e" text-anchor="middle" font-weight="normal" >Halbschattiger Platz auf offenem Boden · je Kammer etwa 1 × 1 m · feucht wie ein ausgedrückter Schwamm</text>
</svg>
