<text x="448" y="214.2" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold" >jung mit den Fingern ausbrechen</text>
<line x1="130" y1="350" x2="90" y2="320" stroke="#6b6b5e" stroke-width="1" />
<text x="24" y="300.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Fruchttraube –</text>
<text x="24" y="316.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >bleibt stehen</text>
<line x1="150" y1="400" x2="100" y2="430" stroke="#6b6b5e" stroke-width="1" />
<text x="24" y="450.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >untere Blätter bis zur</text>
<text x="24" y="466.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >ersten Traube entfernen</text>
<text x="448" y="290.0" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >• wöchentlich kontrollieren</text>
<text x="448" y="311.7" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >• Geiztriebe klein entfernen (unter 5 cm)</text>
<text x="448" y="333.4" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >• Haupttrieb am Stab locker anbinden</text>
<text x="448" y="355.1" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >• Ende August die Spitze kappen</text>
<text x="448" y="376.8" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >• Cocktail- und Wildtomaten dürfen</text>
<text x="448" y="398.5" font-size="14" fill="#2b2b26" text-anchor="start" font-weight="normal" >  mehrtriebig wachsen</text>
