<text x="128" y="110" font-size="14" fill="#6b6b5e" text-anchor="start" font-weight="bold" >O</text>
<line x1="270" y1="215" x2="474" y2="165" stroke="#b9b6a5" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="490" cy="165" r="11" fill="#2b2b26"/>
<text x="490" y="170" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >1</text>
<text x="510" y="170.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Kokosstrick als Achterschlinge</text>
<text x="510" y="186.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >am Pfahl auf der Westseite</text>
<line x1="270" y1="306" x2="474" y2="229" stroke="#b9b6a5" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="490" cy="229" r="11" fill="#2b2b26"/>
<text x="490" y="234" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >2</text>
<text x="510" y="234.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Veredlungsstelle eine</text>
<text x="510" y="250.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Handbreit über der Erde</text>
<line x1="270" y1="326" x2="474" y2="293" stroke="#b9b6a5" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="490" cy="293" r="11" fill="#2b2b26"/>
<text x="490" y="298" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >3</text>
<text x="510" y="298.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Baumscheibe mulchen,</text>
<text x="510" y="314.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Stamm frei lassen</text>
<line x1="270" y1="385" x2="474" y2="357" stroke="#b9b6a5" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="490" cy="357" r="11" fill="#2b2b26"/>
<text x="490" y="362" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >4</text>
<text x="510" y="362.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Pflanzloch doppelt so breit wie der</text>
<text x="510" y="378.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Wurzelballen, Sohle gelockert</text>
<line x1="270" y1="425" x2="474" y2="421" stroke="#b9b6a5" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="490" cy="421" r="11" fill="#2b2b26"/>
<text x="490" y="426" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" >5</text>
<text x="510" y="426.0" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >Wühlmauskorb aus verzinktem Draht</text>
<text x="510" y="442.9" font-size="13" fill="#2b2b26" text-anchor="start" font-weight="normal" >(wo Wühlmäuse vorkommen)</text>
<text x="24" y="525" font-size="13" fill="#6b6b5e" text-anchor="start" font-weight="normal" >Nach dem Pflanzen mit 20–30 Litern angießen und im ersten Sommer regelmäßig wässern.</text>
</svg>
